      genes:
        colour_1: Ry
        pigment: PP
        trim: tt
        trim_saturation: LL
    - species: tulip
      genes:
        colour_1: Rb
        pigment: PP
        trim: TT
        trim_saturation: LL
    - species: tulip
      genes:
        colour_1: RR
        pigment: pp
        trim: TT
        trim_saturation: LL
  goal_flowers:
    - parents:
        - species: tulip
          genes:
            colour_1: bb
            pigment: PP
        - species: tulip
          genes:
            pigment: pp
      child:
        species: tulip
        genes:
          colour_1: yy
          pigment: P*
      goal_percent: 50